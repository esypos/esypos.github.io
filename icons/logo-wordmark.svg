<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">
  <defs>
    <linearGradient id="cartG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="textG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <!-- speed lines -->
  <g fill="#7c3aed" opacity="0.85">
    <rect x="8" y="58" width="52" height="12" rx="6"/>
    <rect x="20" y="86" width="40" height="12" rx="6"/>
    <rect x="12" y="114" width="48" height="12" rx="6"/>
  </g>
  <!-- cart body forming E -->
  <g fill="url(#cartG)">
    <!-- basket -->
    <path d="M78 48
      C78 40, 86 34, 96 34
      L168 34
      C176 34, 182 40, 182 48
      L182 52
      C182 58, 178 62, 172 64
      L188 64
      C196 64, 202 70, 202 78
      L202 118
      C202 128, 194 136, 184 136
      L96 136
      C86 136, 78 128, 78 118
      Z"/>
    <!-- E cutouts (negative space feel via lighter overlays) -->
    <!-- handle -->
    <path d="M168 34 C200 34, 218 52, 218 78 L218 88 C218 94, 212 98, 206 98 L202 98 L202 78 C202 60, 190 48, 172 48 Z" opacity="0.95"/>
    <!-- wheels -->
    <circle cx="108" cy="156" r="14"/>
    <circle cx="168" cy="156" r="14"/>
  </g>
  <!-- E bars (white slots to form E in cart) -->
  <g fill="#fff">
    <rect x="96" y="58" width="70" height="14" rx="4"/>
    <rect x="96" y="86" width="55" height="14" rx="4"/>
    <rect x="96" y="114" width="65" height="14" rx="4"/>
  </g>
  <!-- syPOS text -->
  <text x="230" y="128" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="900" fill="url(#textG)" letter-spacing="-2">syPOS</text>
  <!-- receipt in O area - approximate over the O of POS -->
  <!-- POS starts around: s=230,y~290, P~340, O~430, S~520 - rough -->
  <g transform="translate(448,58)">
    <circle cx="36" cy="48" r="42" fill="#4c1d95"/>
    <rect x="18" y="28" width="36" height="44" rx="5" fill="#fff"/>
    <rect x="24" y="36" width="24" height="4" rx="2" fill="#7c3aed"/>
    <rect x="24" y="46" width="20" height="4" rx="2" fill="#c4b5fd"/>
    <rect x="24" y="56" width="22" height="4" rx="2" fill="#c4b5fd"/>
  </g>
  <!-- tagline -->
  <line x1="160" y1="188" x2="200" y2="188" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <text x="360" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6d28d9" font-weight="600">Simple POS Software for Every Business</text>
  <line x1="520" y1="188" x2="560" y2="188" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
</svg>
