<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EsyPOS - Free Point of Sale</title>
    <noscript><style>body::before{content:"Enable JavaScript to run EsyPOS";display:block;padding:20px;text-align:center}</style></noscript>
    <meta name="description" content="EsyPOS - Free offline point of sale software">
    <meta property="og:title" content="EsyPOS - Free Point of Sale">
    <meta property="og:image" content="icons/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <script>(function(){try{var m=localStorage.getItem('esypos_theme')||'auto';if(m==='dark'||(m==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}})()</script>

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="preconnect" href="https://accounts.google.com">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EsyPOS">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>.hidden{display:none!important}.drawer{position:fixed;top:0;height:100%;transition:transform .28s}.drawer.left{left:0;transform:translateX(-100%)}.drawer.right{right:0;transform:translateX(100%)}.drawer.open{transform:none}</style>
    <link rel="stylesheet" href="style.css">
</head>
<body data-view="pos">

<!-- Desktop sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo"><img class="logo-img" src="icons/icon-192.png" alt="EsyPOS" draggable="false"></div><div><div class="fw7" style="font-size:17px">EsyPOS</div><div class="xs muted">Simple POS for Every Business</div></div></div>
    <nav class="nav" id="nav-desk"></nav>
    <div style="padding:10px;border-top:1px solid var(--border)" class="flex col gap2">
        <div class="js-acct"></div>
        <button class="btn btn-primary btn-block" onclick="Cloud.panel()"><i class="fas fa-cloud"></i> Cloud Backup</button>
        <div class="grid2"><button class="btn btn-ghost" onclick="Theme.toggle()"><i class="theme-ico fas fa-moon"></i> Theme</button><button class="btn btn-ghost" onclick="Lock.lockNow()"><i class="fas fa-lock"></i> Lock</button></div>
        <div class="legal-links"><a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a> · <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a></div>
    </div>
</aside>

<!-- Mobile topbar -->
<header class="topbar">
    <div class="flex items-c gap2"><div class="logo" style="width:34px;height:34px"><img class="logo-img" src="icons/icon-192.png" alt="EsyPOS" draggable="false"></div><b style="font-size:17px">EsyPOS</b></div>
    <div class="flex items-c topbar-actions">
        <button type="button" class="sync-chip js-chip" onclick="Cloud.panel()" title="Google Drive Backup"></button>
        <button class="icon-btn" onclick="Theme.toggle()" title="Dark/Light"><i class="theme-ico fas fa-moon"></i></button>
        <button class="icon-btn" onclick="App.toggleNav()" title="Menu"><i class="fas fa-bars"></i></button>
    </div>
</header>

<main class="main"><div id="view" class="view"></div></main>

<div id="scrim" class="scrim hidden" onclick="App.closeDrawers()"></div>

<!-- Mobile Menu -->
<aside id="mobile-nav" class="drawer left">
    <div class="brand"><div class="logo"><img class="logo-img" src="icons/icon-192.png" alt="EsyPOS" draggable="false"></div><div class="grow"><div class="fw7" style="font-size:17px">EsyPOS</div><div class="xs muted">Simple POS for Every Business</div></div><button class="icon-btn" onclick="App.closeDrawers()"><i class="fas fa-xmark"></i></button></div>
    <nav class="nav" id="nav-mob"></nav>
    <div style="padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border)" class="flex col gap2">
        <div class="js-acct" onclick="App.closeDrawers()"></div>
        <button class="btn btn-primary btn-block" onclick="App.closeDrawers();Cloud.panel()"><i class="fas fa-cloud"></i> Cloud Backup</button>
        <div class="grid2"><button class="btn btn-ghost" onclick="Theme.toggle()"><i class="theme-ico fas fa-moon"></i> Theme</button><button class="btn btn-ghost" onclick="App.closeDrawers();Lock.lockNow()"><i class="fas fa-lock"></i> Lock</button></div>
        <div class="legal-links"><a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a> · <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a></div>
    </div>
</aside>

<!-- Mobile Cart -->
<aside id="mobile-cart" class="drawer right">
    <div class="flex between items-c" style="padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--border)"><b style="font-size:17px">Sales Cart</b><button class="icon-btn" onclick="App.closeDrawers()"><i class="fas fa-xmark"></i></button></div>
    <div id="cart-mobile" style="padding:14px;overflow-y:auto;flex:1;padding-bottom:calc(14px + env(safe-area-inset-bottom))"></div>
</aside>

<button type="button" id="cart-bar" class="cart-bar empty" onclick="App.toggleCart()" aria-label="Cart"></button>

<div id="toast" class="hidden"></div>

<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/people.js"></script>
<script src="js/misc.js"></script>
<script src="js/settings.js"></script>
<script src="js/config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
