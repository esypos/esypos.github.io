<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Page not found – Old POS</title><style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#1c1633;--mu:#6b6785;--pr:#2563eb;--bd:#e6e2f3}
@media(prefers-color-scheme:dark){:root{--bg:#0f0c1d;--card:#181430;--tx:#efeaff;--mu:#a49fc2;--pr:#60a5fa;--bd:#2a2547}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:900px;margin:0 auto;padding:20px 18px 60px}header{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}header img{width:40px;height:40px;border-radius:12px}
header nav{margin-left:auto;font-size:14px;font-weight:600}a{color:var(--pr)}h1{font-size:clamp(28px,6vw,42px);line-height:1.2;margin:30px 0 12px;letter-spacing:-.02em}h2{font-size:24px;margin:42px 0 10px}h3{font-size:17px;margin:18px 0 4px}
p{margin:8px 0;color:var(--mu)}.lead{font-size:18px}.btn{display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff!important;text-decoration:none;font-weight:700;padding:13px 26px;border-radius:14px;margin:14px 10px 0 0}.btn.o{background:none;color:var(--pr)!important;border:1.5px solid var(--bd)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px}.c h3{margin-top:0}.c p{margin:0;font-size:15px}
.s{display:flex;gap:14px;overflow-x:auto;padding:6px 0 14px;scroll-snap-type:x mandatory}.s img{flex:0 0 auto;width:240px;height:auto;border-radius:18px;border:1px solid var(--bd);scroll-snap-align:start}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:10px 0}summary{cursor:pointer;font-weight:700}details p{margin-top:8px}
footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--bd);font-size:14px;color:var(--mu)}
</style></head><body><div class="w"><h1>Page not found</h1><p class="lead">This page does not exist.</p><a class="btn" href="/">Go to Old POS</a></div></body></html>
